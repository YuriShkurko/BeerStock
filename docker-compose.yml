version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: beer_pg
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: beer_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
